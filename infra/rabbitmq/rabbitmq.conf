# =====================================================================
#  RabbitMQ - configuración de DESARROLLO para SocialManagement
#  Se monta en /etc/rabbitmq/conf.d/ y se suma a la configuración por defecto.
#  Usuario, contraseña y vhost por defecto llegan por variables de entorno
#  (RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS / RABBITMQ_DEFAULT_VHOST).
# =====================================================================

# El usuario "guest" solo puede conectarse desde el propio contenedor.
loopback_users.guest = true

listeners.tcp.default = 5672
management.tcp.port   = 15672

# Logs en consola (visibles con: docker compose logs rabbitmq)
log.console       = true
log.console.level = info

# Límites de recursos razonables para un equipo de desarrollo.
vm_memory_high_watermark.relative = 0.4
disk_free_limit.absolute          = 1GB
